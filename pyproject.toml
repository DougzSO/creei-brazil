[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creei"
version = "0.1.0"
description = "Climate Risk Assessment for Energy Infrastructure"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "xarray",
    "netCDF4",
    "h5py",
    "pyarrow",
    "geopandas",
    "shapely",
    "matplotlib",
    "cartopy",
    "pyyaml",
    "requests",
    "openpyxl",
    "xlrd",
    "isimip-client",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 250
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
